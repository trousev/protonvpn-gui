[package]
name = "protonvpn-core"
description = "Console-first wrapper around the Proton VPN CLI: runner, log bus, interpreter, launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
portable-pty.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 of a downloaded AppImage, checked against the `SHA256SUMS` published with it. A hash is
# the one thing here that must not be hand-rolled to save four crates: the failure mode of getting
# it subtly wrong is silent, and it is the check the whole update path rests on. RustCrypto's
# implementation, no features beyond the default.
sha2 = "0.11"
# Project Fluent — the message catalogue. Chosen above the alternatives for one property that
# matters more than the rest: a **developer comment lives beside the message**, in the same file,
# and it is what tells a translator (human, or `scripts/translate`) where the string appears and
# how much room it has. It also carries real per-language plural rules, which an `if` over a
# `format!` cannot, and Russian needs `one` / `few` / `many` where English needs two forms.
fluent-bundle = "0.16"
unic-langid = "0.9"

[build-dependencies]
# The catalogues are parsed before this crate compiles, so a locale that is missing a message, or
# that has lost a `$variable`, stops the build instead of falling back silently at run time.
fluent-syntax = "0.12"

[[bin]]
name = "capture-fixtures"
path = "src/bin/capture_fixtures.rs"
