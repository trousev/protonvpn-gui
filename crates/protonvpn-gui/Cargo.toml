[package]
name = "protonvpn-gui"
description = "Console-first GUI for Proton VPN on Linux: a wrapper around the official protonvpn CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "protonvpn-gui"
path = "src/main.rs"

[dependencies]
protonvpn-core = { path = "../protonvpn-core" }
iced.workspace = true
ksni.workspace = true
# No `serde` here on purpose: config is read and written by `protonvpn-core`, and the UI only ever
# holds the deserialised types. A direct dependency would be one more thing to keep in step for
# nothing.
