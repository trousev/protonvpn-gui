[workspace]
resolver = "3"
members = ["crates/protonvpn-core", "crates/protonvpn-gui"]
default-members = ["crates/protonvpn-core", "crates/protonvpn-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
rust-version = "1.85"
repository = "https://github.com/trousev/protonvpn-gui"

[workspace.dependencies]
portable-pty = "0.9"
# `tiny-skia` and not `wgpu`: a tray companion does not need a GPU, and the software renderer
# works over plain Wayland/X11 without a driver conversation.
#
# `auto-detect-theme` is deliberately absent. The palette is built in `gui/src/theme.rs` and handed
# to iced explicitly, so the feature only adds `dark-light` — and behind it a second `zbus` stack,
# `dconf`, `detect-desktop-environment` and the macOS/Windows/Web branches of each — to guess a
# preference nothing here reads. Measured: 23 crates in the Linux closure.
iced = { version = "0.13", default-features = false, features = [
    "tiny-skia",
    "fira-sans",
    "advanced",
    # The window's repaint beat needs an executor; without one iced falls back to a null backend
    # and `time::every` does not exist at all (`tiny-skia` alone renders, it does not schedule).
    "tokio",
] }
# The `blocking` API puts the StatusNotifierItem on its own thread; `async-io` avoids pulling in a
# whole async runtime for it. zbus (not libdbus) means no C dependency.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
