[workspace]
resolver = "3"
members = ["crates/protonvpn-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
rust-version = "1.85"
repository = "https://github.com/trousev/protonvpn-gui"

[workspace.dependencies]
portable-pty = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
